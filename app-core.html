<script>
(function(){
  try{
    var raw=localStorage.getItem('wordmemo1000.ngsl.teacher.v5');
    var saved=raw?JSON.parse(raw):null;
    var choice=saved&&saved.settings&&saved.settings.theme?saved.settings.theme:'system';
    var resolved=choice==='system'&&window.matchMedia? (window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light') : choice;
    if(resolved!=='dark') resolved='light';
    document.documentElement.dataset.theme=resolved;
    document.documentElement.style.colorScheme=resolved;
  }catch(e){}
})();
</script>

function analyzeSentence(w){
  const s=w.ex;
  const tokens=(s.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]);
  const l=tokens.map(x=>x.toLowerCase());
  let topic='present-simple', secondary=[], aux='', verb='';
  const set=(t,a='',v='')=>{topic=t;aux=a;verb=v};

  let m=null;
  if((m=s.match(/\bwill\s+have\s+been\s+(\w+ing)\b/i))) set('future-perfect-continuous','will have been',m[1]);
  else if((m=s.match(/\bwill\s+have\s+(\w+(?:ed|en)|been|gone|done|seen|made|known|found|given|taken|come|become|written|read|set|left|felt|built|shown|eaten|sold)\b/i))) set('future-perfect','will have',m[1]);

    const hq=s.match(/^\s*(Have|Has)\b.*\b([A-Za-z]+(?:ed|en)|been|gone|done|seen|made|known|found|given|taken|come|become|written|read|set|left|felt|built|shown|eaten|sold)\b/i);

            const modal=l.find(x=>MODALS.includes(x));
            if(modal){set('modal',modal,detectVerbAfter(tokens,l.indexOf(modal)));}

  secondary=[...new Set(secondary)].filter(x=>x!==topic);

  const pieces=[];
  if(aux) pieces.push({text:aux,role:'вспомогательная/служебная часть'});
  if(verb&&verb.toLowerCase()!==aux.toLowerCase()) pieces.push({text:verb,role:topic.includes('continuous')?'смысловой глагол в форме V-ing':topic.includes('perfect')||secondary.includes('passive')?'смысловой глагол / V3':'смысловой глагол'});

el.innerHTML=pageHeader(title,subtitle)+`<div class="study-wrap"><div class="session-head"><span>${sessionIndex+1} / ${session.length}</span><span>${statusOf(c)==='new'?'Новое слово':'Следующее повторение: '+dueLabel(c.due)}</span></div><div class="progress"><i style="width:${Math.round((sessionIndex/session.length)*100)}%"></i></div><div class="flash" style="margin-top:14px"><span class="rank">NGSL #${w.rank}</span><span class="band-chip ${w.band==='foundation'?'band-foundation':'band-bridge'}">${w.band==='foundation'?'A1–A2 foundation':'A2–B1 bridge'}</span><button class="speak" onclick="speak('${w.en.replace(/'/g,"\\'")}')" title="Произнести слово">🔊</button>${content}<div class="skill-line"><span class="skill ${(c.recallOK||0)>=2?'ok':''}">Активное вспоминание: ${Math.min(2,c.recallOK||0)}/2</span><span class="skill ${(c.contextOK||0)>=2?'ok':''}">Контекст: ${Math.min(2,c.contextOK||0)}/2</span></div></div><div id="ratings" class="ratings ${revealed?'':'hidden'}"><button class="again" onclick="rate(0)">1 · Снова<small>через 1 мин</small></button><button class="hard" onclick="rate(1)">2 · Трудно<small>${previewInterval(c,1)}</small></button><button class="good" onclick="rate(2)">3 · Хорошо<small>${previewInterval(c,2)}</small></button><button class="easy" onclick="rate(3)">4 · Легко<small>${previewInterval(c,3)}</small></button></div></div>`;
setTimeout(()=>{if(isRecall)document.getElementById('recallInput')?.focus();if(isContext)document.getElementById('contextInput')?.focus()},20)}
function reveal(){revealed=true;document.getElementById('answer')?.classList.remove('hidden');document.getElementById('ratings')?.classList.remove('hidden');document.getElementById('revealBtn')?.classList.add('hidden')}
function norm(s){return s.toLowerCase().trim().replace(/[’]/g,"'").replace(/\s+/g,' ')}
function recordTypedAttempt(kind,ok){if(attemptRecorded)return;attemptRecorded=true;const k=todayKey();if(!state.history[k])state.history[k]={reviews:0,again:0,hard:0,good:0,easy:0,new:0};const h=state.history[k];const key=kind+(ok?'Correct':'Wrong');h[key]=(h[key]||0)+1;save()}
function checkRecall(){const w=session[sessionIndex],c=cardState(w.id),inp=document.getElementById('recallInput'),fb=document.getElementById('feedback');if(!inp||revealed)return;const ok=norm(inp.value)===norm(w.en);lastTypedCorrect=ok;revealed=true;if(ok)c.recallOK=(c.recallOK||0)+1;else c.recallWrong=(c.recallWrong||0)+1;recordTypedAttempt('recall',ok);fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'Верно ✓':'Ответ: '+w.en;const ex=document.getElementById('recallExample');if(ex){ex.innerHTML='<span class="sub">Пример употребления</span><br>'+highlightWord(w.ex,w.en)+'<div class="example-translation"><span class="translation-label">Перевод</span>'+escapeHTML(w.exRu)+'</div>'+exampleTools(w)+(ok?'':'<div class="wrong-lock">Ошибка уже учтена: эту попытку нельзя отметить как «Хорошо» или «Легко».</div>');ex.classList.remove('hidden')}document.getElementById('ratings').classList.remove('hidden');save();if(ok)speak(w.en)}
function checkContext(){const w=session[sessionIndex],c=cardState(w.id),inp=document.getElementById('contextInput'),fb=document.getElementById('feedback');if(!inp||revealed)return;const ok=norm(inp.value)===norm(w.en);lastTypedCorrect=ok;revealed=true;if(ok)c.contextOK=(c.contextOK||0)+1;else c.contextWrong=(c.contextWrong||0)+1;recordTypedAttempt('context',ok);fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'Верно ✓':'Нужно вставить: '+w.en;const ex=document.getElementById('contextExample');if(ex){ex.innerHTML='<span class="sub">Правильное предложение</span><br>'+highlightWord(w.ex,w.en)+'<div class="example-translation"><span class="translation-label">Перевод</span>'+escapeHTML(w.exRu)+'</div>'+exampleTools(w)+(ok?'':'<div class="wrong-lock">Ошибка уже учтена: эту попытку нельзя отметить как «Хорошо» или «Легко».</div>');ex.classList.remove('hidden')}document.getElementById('contextCheck')?.classList.add('hidden');document.getElementById('ratings').classList.remove('hidden');save();if(ok)speak(w.ex)}
function previewInterval(c,q){if(q===1)return c.reps===0?'10 мин':Math.max(1,Math.round(Math.max(1,c.interval)*1.2))+' дн';if(q===2)return (c.reps===0?1:c.reps===1?3:Math.max(1,Math.round(c.interval*c.ease)))+' дн';return (c.reps===0?4:Math.max(4,Math.round(Math.max(1,c.interval)*c.ease*1.3)))+' дн'}
function rate(q){const w=session[sessionIndex],c=cardState(w.id),now=Date.now(),wasNew=c.status==='new';if(lastTypedCorrect===false&&q>1){q=1;toast('После ошибки максимум — «Трудно»');}c.last=now;if(q===0){c.lapses++;c.reps=0;c.interval=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+MIN;c.status='learning'}else if(q===1){c.reps++;c.ease=Math.max(1.3,c.ease-.15);if(c.reps<=1){c.interval=0;c.due=now+10*MIN}else{c.interval=Math.max(1,Math.round(Math.max(1,c.interval)*1.2));c.due=now+c.interval*DAY}c.status='learning'}else if(q===2){c.reps++;if(c.reps===1)c.interval=1;else if(c.reps===2)c.interval=3;else c.interval=Math.max(1,Math.round(c.interval*c.ease));c.due=now+c.interval*DAY;c.status='learning'}else{c.reps++;c.ease=Math.min(3.2,c.ease+.15);c.interval=c.reps===1?4:Math.max(4,Math.round(Math.max(1,c.interval)*c.ease*1.3));c.due=now+c.interval*DAY;c.status='learning'}
const k=todayKey();if(!state.history[k])state.history[k]={reviews:0,again:0,hard:0,good:0,easy:0,new:0};const h=state.history[k];h.reviews++;h[['again','hard','good','easy'][q]]++;if(wasNew)h.new++;save();sessionIndex++;revealed=false;attemptRecorded=false;lastTypedCorrect=null;renderStudy()}
function studyExtra(){const h=historyToday();h.new=Math.max(0,(h.new||0)-10);state.history[todayKey()]=h;save();session=buildSession();sessionIndex=0;attemptRecorded=false;lastTypedCorrect=null;renderStudy()}
function wordRows(q='',f=filter,bf=bandFilter){q=q.toLowerCase();return WORDS.filter(w=>!q||w.en.toLowerCase().includes(q)||w.ru.toLowerCase().includes(q)).filter(w=>f==='all'||statusOf(state.cards[w.id])===f).filter(w=>bf==='all'||w.band===bf).map(w=>{const c=cardState(w.id),s=statusOf(c);return `<tr><td>${w.rank}</td><td><b>${escapeHTML(w.en)}</b><div class="mini-muted">${w.band==='foundation'?'A1–A2 foundation':'A2–B1 bridge'}</div></td><td>${escapeHTML(w.ru)}</td><td><span class="badge ${s}">${s==='new'?'новое':s==='learning'?'учу':'освоено'}</span><div class="mini-muted">Recall ${Math.min(2,c.recallOK||0)}/2 · Context ${Math.min(2,c.contextOK||0)}/2</div></td><td><div style="display:flex;gap:5px"><button class="btn" style="padding:6px 9px" onclick="studyOne(${w.id})">Учить</button><button class="btn soft" style="padding:6px 9px" onclick="openLibraryWord(${w.id})">Справка</button></div></td></tr>`}).join('')}
function renderWords(){document.getElementById('page-words').innerHTML=pageHeader('NGSL 1000','Леммы вместо повторяющихся словоформ. Фильтруйте по учебному блоку и реальному статусу освоения.')+`<div class="toolbar"><input id="searchWords" placeholder="Поиск: word / перевод" oninput="updateWordRows()"><select id="filterWords" onchange="filter=this.value;updateWordRows()"><option value="all" ${filter==='all'?'selected':''}>Все статусы</option><option value="new" ${filter==='new'?'selected':''}>Новые</option><option value="learning" ${filter==='learning'?'selected':''}>В изучении</option><option value="mastered" ${filter==='mastered'?'selected':''}>Освоено</option></select><select id="bandWords" onchange="bandFilter=this.value;updateWordRows()"><option value="all" ${bandFilter==='all'?'selected':''}>Оба блока</option><option value="foundation" ${bandFilter==='foundation'?'selected':''}>A1–A2 foundation (1–500)</option><option value="bridge" ${bandFilter==='bridge'?'selected':''}>A2–B1 bridge (501–1000)</option></select></div><div class="panel" style="overflow:auto;margin-top:0"><table class="word-table"><thead><tr><th>#</th><th>English</th><th>Русский</th><th>Освоение</th><th></th></tr></thead><tbody id="wordRows">${wordRows('',filter,bandFilter)}</tbody></table></div>`}
function updateWordRows(){const q=document.getElementById('searchWords')?.value||'';const f=document.getElementById('filterWords')?.value||filter;const bf=document.getElementById('bandWords')?.value||bandFilter;filter=f;bandFilter=bf;const body=document.getElementById('wordRows');if(body)body.innerHTML=wordRows(q,f,bf)}
function studyOne(id){session=[WORDS.find(w=>w.id===id)];sessionIndex=0;currentMode='teacher';revealed=false;attemptRecorded=false;lastTypedCorrect=null;nav('study')}
function renderStats(){const c=counts(),days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10),v=state.history[k]?.reviews||0;days.push({k,v,label:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})})}const max=Math.max(1,...days.map(x=>x.v));const total=Object.values(state.history).reduce((a,h)=>a+(h.reviews||0),0),good=Object.values(state.history).reduce((a,h)=>a+(h.good||0)+(h.easy||0),0);const ctxOk=Object.values(state.history).reduce((a,h)=>a+(h.contextCorrect||0),0),ctxBad=Object.values(state.history).reduce((a,h)=>a+(h.contextWrong||0),0),ctxTotal=ctxOk+ctxBad;const recOk=Object.values(state.history).reduce((a,h)=>a+(h.recallCorrect||0),0),recBad=Object.values(state.history).reduce((a,h)=>a+(h.recallWrong||0),0),recTotal=recOk+recBad;document.getElementById('page-stats').innerHTML=pageHeader('Статистика','Смотрим не только количество повторений, но и способность самостоятельно воспроизвести и употребить слово.')+`<div class="grid"><div class="stat"><div class="n">${total}</div><div class="l">всего повторений</div></div><div class="stat"><div class="n">${recTotal?Math.round(recOk/recTotal*100):0}%</div><div class="l">активное вспоминание</div></div><div class="stat"><div class="n">${ctxTotal?Math.round(ctxOk/ctxTotal*100):0}%</div><div class="l">точность в контексте</div></div><div class="stat"><div class="n">${c.m}</div><div class="l">освоено по строгому критерию</div></div></div><div class="panel"><h2>Последние 14 дней</h2><div class="chart">${days.map(x=>`<div class="bar" title="${x.v} повторений" style="height:${Math.max(3,Math.round(x.v/max*120))}px"><span>${x.label}</span></div>`).join('')}</div></div><div class="panel"><h2>Что считается «освоено»</h2><div class="sub">Минимум 5 успешных повторений · интервал ≥ 21 дня · активный ввод слова ≥ 2 раз · правильное употребление в контексте ≥ 2 раз. Это защищает от иллюзии знания, когда перевод кажется знакомым, но слово не получается использовать.</div></div><div class="panel"><h2>Распределение слов</h2><div class="sub">Новые ${c.n} · В изучении ${c.l} · Освоено ${c.m}</div><div class="progress" style="margin-top:14px"><i style="width:${Math.round(c.m/10)}%"></i></div></div>`}
function isiPhoneLike(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandaloneApp(){return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||!!navigator.standalone}
function iphoneSettingsHtml(){const ios=isiPhoneLike(),standalone=isStandaloneApp(),secure=(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');let status=standalone?'Открыто как web‑app':ios?'Открыто в Safari':'PWA-сборка готова';let detail=standalone?'Интерфейс работает в отдельном окне, а нижняя навигация учитывает safe area iPhone.':ios?'Для наиболее стабильной работы добавьте HTTPS-версию на экран «Домой».':'Эту же сборку можно разместить на HTTPS и установить на iPhone через Safari.';return `<div class="field device-card" style="grid-column:1/-1"><label>iPhone / мобильное приложение</label><p>WordMemo адаптирован под Safari, вырез Dynamic Island / «чёлку», нижний Home Indicator и экранную клавиатуру.</p><div class="device-status"><div class="device-icon">📱</div><div><b>${status}</b><span class="sub">${detail}</span></div></div><ol class="install-steps"><li>Откройте размещённую HTTPS-версию WordMemo именно в Safari.</li><li>Нажмите «Поделиться» → «На экран Домой».</li><li>Включите «Открыть как веб‑приложение» и нажмите «Добавить».</li></ol><div class="mini-muted">После первого запуска PWA-кэширует приложение для офлайн-работы. Прогресс остаётся на этом устройстве; периодически делайте «Экспорт JSON».</div>${location.protocol==='file:'?'<div class="compat-note">Сейчас приложение открыто как локальный файл. На компьютере это нормально. На iPhone просмотр HTML из приложения «Файлы» может открыться как предпросмотр, поэтому для iPhone рекомендуем PWA/HTTPS-версию из ZIP.</div>':''}</div>`}
function renderSettings(){const s=state.settings;document.getElementById('page-settings').innerHTML=pageHeader('Настройки','Интенсивность обучения, оформление, iPhone и резервные копии.')+`<div class="settings"><div class="field"><label>Новых слов в день</label><p>Сколько новых слов добавлять в день. Для устойчивого A2–B1 прогресса рекомендовано 8–12, поэтому по умолчанию стоит 10.</p><input type="number" min="1" max="30" value="${s.newPerDay}" onchange="setSetting('newPerDay',Math.max(1,Math.min(30,+this.value||10)))"></div><div class="field"><label>Порядок карточек</label><p>Смешивать повторения с новыми или показывать случайно.</p><select onchange="setSetting('mode',this.value)"><option value="mixed" ${s.mode==='mixed'?'selected':''}>Повторения + новые вперемешку</option><option value="random" ${s.mode==='random'?'selected':''}>Случайный порядок</option></select></div><div class="field"><label>Учебный блок</label><p>Можно временно сосредоточиться только на базовом или переходном блоке.</p><select onchange="setSetting('band',this.value)"><option value="all" ${s.band==='all'?'selected':''}>Все 1000</option><option value="foundation" ${s.band==='foundation'?'selected':''}>A1–A2 foundation: 1–500</option><option value="bridge" ${s.band==='bridge'?'selected':''}>A2–B1 bridge: 501–1000</option></select></div><div class="field"><label>Оформление</label><p>Тема сохраняется вместе с прогрессом. «Системная» повторяет оформление устройства.</p><div class="theme-picker"><button class="theme-option ${s.theme==='system'?'active':''}" onclick="setThemeChoice('system')"><span>Системная</span><small>Как на устройстве</small><span class="theme-preview preview-system"><i></i><i></i></span></button><button class="theme-option ${s.theme==='light'?'active':''}" onclick="setThemeChoice('light')"><span>Светлая</span><small>Всегда светлая</small><span class="theme-preview preview-light"><i></i><i></i></span></button><button class="theme-option ${s.theme==='dark'?'active':''}" onclick="setThemeChoice('dark')"><span>Тёмная</span><small>Всегда тёмная</small><span class="theme-preview preview-dark"><i></i><i></i></span></button></div></div>${iphoneSettingsHtml()}<div class="field"><label>Резервная копия</label><p>Экспорт сохраняет прогресс, интервалы, историю и настройки. На iPhone откроется системное меню «Поделиться», если браузер поддерживает передачу файлов.</p><div class="actions"><button class="btn" onclick="exportData()">Экспорт JSON</button><label class="btn">Импорт JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="field"><label>Хранение прогресса</label><p>${storageOK?'Локальное хранилище браузера доступно. Прогресс сохраняется автоматически.':'Браузер запретил локальное хранилище. Экспортируйте прогресс вручную до закрытия приложения.'}</p><div class="badge ${storageOK?'mastered':'learning'}">${storageOK?'Сохранение работает':'Требуется резервная копия'}</div></div><div class="field" style="grid-column:1/-1"><label>Сброс прогресса</label><p>Удаляет только локальную историю обучения. Сама колода NGSL 1000 останется.</p><button class="btn danger" onclick="resetProgress()">Сбросить всё</button></div></div>`}
function setSetting(k,v){state.settings[k]=v;save();toast('Сохранено')}
async function exportData(){const name='wordmemo-backup-'+todayKey()+'.json',text=JSON.stringify(state,null,2);try{const file=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'WordMemo backup'});toast('Резервная копия передана');return}}catch(e){if(e&&e.name==='AbortError')return}const blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Резервная копия сохранена')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||s.version!==1)throw 0;state=s;save();applyTheme();render(currentPage);toast('Прогресс импортирован')}catch(e){alert('Не удалось прочитать резервную копию.')}};r.readAsText(file)}
function resetProgress(){if(confirm('Сбросить весь прогресс обучения?')){const settings=state.settings;state=defaultState();state.settings=settings;save();render(currentPage);toast('Прогресс сброшен')}}
function speak(word){if(!('speechSynthesis'in window))return toast('Озвучивание не поддерживается браузером');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
function speakRandom(){speak(WORDS[Math.floor(Math.random()*WORDS.length)].en)}
function render(page){({home:renderHome,study:renderStudy,words:renderWords,library:renderLibrary,stats:renderStats,settings:renderSettings}[page]||renderHome)()}
document.addEventListener('keydown',e=>{if(currentPage!=='study')return;if(e.target?.tagName==='INPUT'&&e.key!=='Enter')return;if(e.code==='Space'&&!revealed&&(currentMode==='cards'||(currentMode==='teacher'&&session[sessionIndex]&&teacherModeFor(session[sessionIndex])==='cards'))){e.preventDefault();reveal()}if(revealed&&['1','2','3','4'].includes(e.key))rate(+e.key-1)});
window.addEventListener('error',e=>{const home=document.getElementById('page-home');if(home&&!window.__WORDMEMO_READY__){home.innerHTML='<div class="boot-card error"><h1>WordMemo не смог запуститься</h1><p>'+escapeHTML(e.message||'Неизвестная ошибка JavaScript')+'</p><p>Откройте файл в обычном Chrome, Edge, Firefox или Safari, а не во встроенном предпросмотре.</p></div>'}});
function setupMobileViewport(){if(!window.visualViewport)return;let maxH=window.visualViewport.height;const sync=()=>{const h=window.visualViewport.height;if(h>maxH)maxH=h;document.body.classList.toggle('keyboard-open',h<maxH*.74)};window.visualViewport.addEventListener('resize',sync);window.visualViewport.addEventListener('scroll',sync);sync()}
try{const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)');if(mq){const onChange=()=>{if((state.settings.theme||'system')==='system')applyTheme()};if(mq.addEventListener)mq.addEventListener('change',onChange);else if(mq.addListener)mq.addListener(onChange)}}catch(e){}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('WordMemo service worker:',e)))}
setupMobileViewport();applyTheme();renderHome();window.__WORDMEMO_READY__=true;
