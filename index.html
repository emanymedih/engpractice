<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><link rel="icon" href="./icons/icon-192.png" type="image/png"><title>WordMemo 1000</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:20px}.boot{width:min(100%,560px);padding:28px;background:white;border:1px solid #e6e9ef;border-radius:20px;box-shadow:0 16px 48px rgba(17,24,39,.08)}.boot b{font-size:20px}.boot p{margin:10px 0}.boot small{color:#667085}.boot .err{color:#b42318}.boot button{margin-top:12px;padding:11px 14px;border:0;border-radius:12px;background:#1f6feb;color:white;font-weight:700}</style></head><body><div class="boot"><b>WordMemo 1000</b><p id="bootStatus">Загружаю учебник…</p><small>v11.1.1 · audited stable core</small></div><script>(async()=>{const status=document.getElementById('bootStatus');try{const r=await fetch('./app-core.html',{cache:'no-store'});if(!r.ok)throw new Error('core HTTP '+r.status);let h=await r.text();if(!/\bconst\s+WORDS\b|\bWORDS\s*=/.test(h))throw new Error('core integrity check failed');h=h.replace('</head>','<link rel="icon" href="./icons/icon-192.png" type="image/png"><link rel="stylesheet" href="./v11.css?v=11.1.1"></head>');h=h.replace('</body>','<script src="./v11.js?v=11.1.1"><\/script><script src="./v11.1-fixes.js?v=11.1.1"><\/script></body>');document.open();document.write(h);document.close()}catch(e){console.error('WordMemo boot failed',e);status.className='err';status.textContent='Не удалось запустить учебник: '+String(e.message||e);const b=document.createElement('button');b.textContent='Открыть стабильную версию';b.onclick=()=>location.href='./app-core.html';document.querySelector('.boot').appendChild(b)}})();</script></body></html>
