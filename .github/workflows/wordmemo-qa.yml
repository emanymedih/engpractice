name: WordMemo QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v11.js
          node --check v11.1-fixes.js
      - name: Smoke test
        run: node tests/smoke.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    needs: static-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser QA
        run: npm run test:e2e
