<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WordMemo Diagnostics</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#172033;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}.ok{color:#14804a}.bad{color:#b42318}.wait{color:#667085}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:0;border-radius:12px;padding:11px 14px;background:#1f6feb;color:white;font-weight:700;text-decoration:none}.secondary{background:#eef2f6!important;color:#172033!important}.warning{background:#fff4e5!important;color:#8a4b08!important}@media(max-width:560px){body{padding:14px}.row{display:grid;gap:4px}.row span{text-align:left}}</style></head><body><div class="wrap"><h1>WordMemo · диагностика</h1><p>Независимая проверка загрузки, PWA и локального хранения. Сборка v11.1.1.</p><div class="card" id="checks"></div><div class="card actions"><button onclick="location.href='./'">Открыть WordMemo</button><a class="btn secondary" href="./app-core.html">Стабильное ядро без v11</a><a class="btn warning" href="./repair.html">Ремонт кэша без удаления прогресса</a></div></div><script>
const checks=document.getElementById('checks');function row(name,status,detail=''){const d=document.createElement('div');d.className='row';d.innerHTML='<b>'+name+'</b><span class="'+status+'">'+(status==='ok'?'OK':status==='bad'?'Ошибка':'Проверка')+(detail?' · '+detail:'')+'</span>';checks.appendChild(d)}
(async()=>{for(const f of ['./index.html','./app-core.html','./v11.js?v=11.1.1','./v11.1-fixes.js?v=11.1.1','./v11.css?v=11.1.1','./sw.js','./manifest.webmanifest']){try{const r=await fetch(f,{cache:'no-store'});row(f,r.ok?'ok':'bad','HTTP '+r.status)}catch(e){row(f,'bad',String(e.message||e))}}try{const k='wordmemo-diag-'+Date.now();localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);row('localStorage',ok?'ok':'bad')}catch(e){row('localStorage','bad',e.name)}try{await new Promise((resolve,reject)=>{const r=indexedDB.open('wordmemo-diagnostics',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('x'))r.result.createObjectStore('x')};r.onsuccess=()=>{r.result.close();resolve()};r.onerror=()=>reject(r.error)});row('IndexedDB','ok')}catch(e){row('IndexedDB','bad',e?.name||'unavailable')}try{const persisted=await navigator.storage?.persisted?.();row('Persistent storage',persisted?'ok':'wait',persisted?'разрешено браузером':'best-effort / не гарантировано')}catch(e){row('Persistent storage','wait','API недоступен')}row('HTTPS / secure context',window.isSecureContext?'ok':'bad',location.protocol);if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.getRegistration('./');row('Service Worker',reg?'ok':'wait',reg?'зарегистрирован':'будет зарегистрирован после запуска приложения')}catch(e){row('Service Worker','bad',e.name)}}else row('Service Worker','bad','не поддерживается');row('Standalone PWA',(matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'ok':'wait',(matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'web-app':'обычный браузер');})();
</script></body></html>
